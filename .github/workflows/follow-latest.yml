name: Follow tessh.dev latest

# Tessh releases go live when they are published in the Hub; tessh.dev/updates/mac/latest.json moves then.
# This keeps the cask in step within the hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: follow-latest
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update the cask from latest.json
        run: scripts/follow-latest.sh
      - name: Commit and push
        run: |
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/tessh.rb)
          git commit -am "tessh ${version/,/ (})"
          git push
